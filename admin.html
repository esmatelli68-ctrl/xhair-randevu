
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XHAIR Yönetim Paneli</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9edf2;
      margin: 0;
      padding: 25px;
      text-align: center;
    }
    .panel {
      max-width: 400px;
      margin: 70px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px #0001;
    }
    h1 { color: #ad4777; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }
    input { border: 1px solid #ddd; }
    button {
      background: #ad4777;
      color: white;
      border: none;
      cursor: pointer;
    }
    #message { margin-top: 16px; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>XHAIR</h1>
    <h3>Yönetim Paneli</h3>
    <div id="login">
      <input id="email" type="email"
             placeholder="E-posta adresin">
      <input id="password" type="password"
             placeholder="Şifren">
      <button onclick="login()">Giriş Yap</button>
<button type="button" onclick="resetPassword()">Şifremi Unuttum</button>
    </div>
    <div id="dashboard" hidden>
      <h3>Hoş geldiniz</h3>
      <h3>Müşteri Randevuları</h3>
<button onclick="loadAppointments()">Randevuları Yenile</button>
<div id="appointmentsList">
  Randevular yükleniyor...
</div>
      <button onclick="logout()">Çıkış Yap</button>
    </div>
    <p id="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://mirbwrohdojokuxfzkpw.supabase.co";

    const SUPABASE_KEY =
     "sb_publishable_McvukeA-JxnHfxahU8DlkA_6h4BnQkZ";
alert("Supabase koduna ulaşıldı");
    let client;

try {
  client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  alert("Supabase bağlantısı oluşturuldu");
} catch (error) {
  alert("Bağlantı hatası: " + error.message);
}

    const message = document.getElementById("message");

    function showDashboard(user) {
      document.getElementById("login").hidden = !!user;
      document.getElementById("dashboard").hidden = !user;
    }
async function resetPassword() {
  const email = document.getElementById("email").value.trim();

  if (!email) {
    message.textContent = "Önce e-posta adresini yaz.";
    return;
  }

  const { error } = await client.auth.resetPasswordForEmail(email, {
    redirectTo: "https://esmatelli68-ctrl.github.io/xhair-randevu/admin.html"
  });

  message.textContent = error
    ? "Hata: " + error.message
    : "Şifre sıfırlama isteği gönderildi. E-postanı kontrol et.";
}
    async function login() {
      message.textContent = "Giriş kontrol ediliyor...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { data, error } =
        await client.auth.signInWithPassword({
          email, password
        });

      if (error) {
        message.textContent = "Giriş başarısız: " + error.message;
        return;
      }

      message.textContent = "";
      showDashboard(data.user);
    }
async function loadAppointments() {
  const list = document.getElementById("appointmentsList");
  list.textContent = "Randevular yükleniyor...";

  const { data, error } = await client
    .from("appointments")
    .select("*")
    .order("appointment_date", { ascending: true })
    .order("appointment_time", { ascending: true });

  if (error) {
    list.textContent = "Hata: " + error.message;
    return;
  }

  list.replaceChildren();

  if (!data.length) {
    list.textContent = "Henüz randevu yok.";
    return;
  }

  data.forEach(a => {
    const card = document.createElement("div");
    card.style.cssText =
      "border:1px solid #ddd;padding:12px;margin:12px 0;border-radius:10px;text-align:left;";

    const details = document.createElement("p");
    details.textContent =
      `${a.full_name} | ${a.phone} | ${a.service} | ${a.appointment_date} ${a.appointment_time} | Durum: ${a.status}`;

if (a.status === "approved") {
  card.style.border = "2px solid #16a34a";
  card.style.background = "#f0fdf4";
}


    card.appendChild(details);

    if (a.status === "pending") {
      const approve = document.createElement("button");
      approve.textContent = "Onayla";
      approve.onclick = () => updateAppointment(a.id, "approved");

      const reject = document.createElement("button");
      reject.textContent = "Reddet";
      reject.onclick = () => updateAppointment(a.id, "rejected");

      card.append(approve, reject);
    }

    list.appendChild(card);
  });
}

async function updateAppointment(id, status) {
  const { error } = await client
    .from("appointments")
    .update({ status })
    .eq("id", id);

  if (error) {
    alert("Hata: " + error.message);
    return;
  }

  alert(status === "approved" ? "Randevu onaylandı!" : "Randevu reddedildi.");
  await loadAppointments();
}
    async function logout() {
      await client.auth.signOut();
      showDashboard(null);
      message.textContent = "";
    }

client.auth.getUser().then(({data}) => {
  showDashboard(data.user);
  if (data.user) loadAppointments();
});         
client.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") {
    setTimeout(async () => {
      const newPassword = prompt("Yeni şifreni yaz (en az 8 karakter):");

      if (!newPassword || newPassword.length < 8) {
        alert("Şifre en az 8 karakter olmalı.");
        return;
      }

      const { error } = await client.auth.updateUser({
        password: newPassword
      });

      if (error) {
        alert("Hata: " + error.message);
      } else {
        alert("Şifren başarıyla değiştirildi!");
        await client.auth.signOut();
        window.location.href = "admin.html";
      }
    }, 500);
  }
});
  </script>
</body>
</html>
